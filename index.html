<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Menu Button</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!-- تم روشن -->
        <div class="theme-box">
            <div class="selector">
                <div class="knob"></div>
                <ul>
                    <li><span><i class="fa-solid fa-arrow-left"></i></span><input type="radio" name="choice-a" checked /></li>
                    <li><span><i class="fa-solid fa-house"></i></span><input type="radio" name="choice-a" /></li>
                    <li><span><i class="fa-solid fa-magnifying-glass"></i></span><input type="radio" name="choice-a" /></li>
                    <li><span><i class="fa-regular fa-star"></i></span><input type="radio" name="choice-a" /></li>
                    <li><span><i class="fa-solid fa-ellipsis-vertical"></i></span><input type="radio" name="choice-a" /></li>
                    <li><span><i class="fa-solid fa-rotate-right"></i></span><input type="radio" name="choice-a" /></li>
                </ul>
            </div>
        </div>

        <!-- تم تیره -->
        <div class="theme-box" data-theme="dark">
            <div class="selector">
                <div class="knob"></div>
                <ul>
                    <li><span><i class="fa-solid fa-arrow-left"></i></span><input type="radio" name="choice-b" checked /></li>
                    <li><span><i class="fa-solid fa-house"></i></span><input type="radio" name="choice-b" /></li>
                    <li><span><i class="fa-solid fa-magnifying-glass"></i></span><input type="radio" name="choice-b" /></li>
                    <li><span><i class="fa-regular fa-star"></i></span><input type="radio" name="choice-b" /></li>
                    <li><span><i class="fa-solid fa-ellipsis-vertical"></i></span><input type="radio" name="choice-b" /></li>
                    <li><span><i class="fa-solid fa-rotate-right"></i></span><input type="radio" name="choice-b" /></li>
                </ul>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
